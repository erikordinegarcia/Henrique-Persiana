<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" role="img" aria-label="Perfil Decorações luxury logo">
  <defs>
    <linearGradient id="goldGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBE7AE"/>
      <stop offset="42%" stop-color="#D4AF5A"/>
      <stop offset="100%" stop-color="#B9872F"/>
    </linearGradient>
  </defs>

  <!-- transparent outer canvas -->
  <rect x="150" y="150" width="1300" height="1300" rx="120" fill="#000" fill-opacity="0.94"/>

  <!-- initials -->
  <text x="800" y="860"
        text-anchor="middle"
        font-family="Didot, Bodoni MT, Times New Roman, serif"
        font-size="700"
        font-weight="700"
        font-style="italic"
        letter-spacing="4"
        fill="url(#goldGradient)">PD</text>

  <!-- brand name -->
  <text x="800" y="1080"
        text-anchor="middle"
        font-family="Avenir Next, Montserrat, Helvetica Neue, Arial, sans-serif"
        font-size="74"
        font-weight="500"
        letter-spacing="8"
        fill="#E7C67A">Perfil Decorações</text>
</svg>
