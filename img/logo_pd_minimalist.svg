<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" role="img" aria-label="PD minimalist luxury logo">
  <defs>
    <linearGradient id="goldGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE9A4"/>
      <stop offset="38%" stop-color="#D9AF5A"/>
      <stop offset="68%" stop-color="#B8862E"/>
      <stop offset="100%" stop-color="#F2C46D"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent canvas with a dark luxury panel -->
  <rect x="120" y="120" width="1360" height="1360" rx="96" fill="#000000" fill-opacity="0.92"/>

  <!-- Monogram -->
  <text x="800" y="930"
        text-anchor="middle"
        font-family="Didot, Bodoni MT, Times New Roman, serif"
        font-size="760"
        font-style="italic"
        font-weight="700"
        letter-spacing="8"
        fill="url(#goldGradient)"
        filter="url(#softGlow)">PD</text>
</svg>
